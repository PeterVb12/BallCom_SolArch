version: "3.8"

services:
  # 1.  Message Broker (RabbitMQ)
  rabbitmq:
    image: rabbitmq:3-management
    container_name: ballcom_rabbitmq
    ports:
      - "5672:5672" # Dit is de poort waar je .NET code straks berichten naartoe stuurt
      - "15672:15672" # Dit is het dashboard waar je in de browser naar kunt kijken
    networks:
      - ballcom_network

  # 2. De database voor de Ordering Service
  ordering_db:
    image: postgres:latest
    container_name: ballcom_ordering_db
    environment:
      POSTGRES_USER: ballcom_user
      POSTGRES_PASSWORD: ballcom_password
      POSTGRES_DB: ordering_db
    ports:
      - "5432:5432" # De poort van je database
    networks:
      - ballcom_network

  # 3. De database voor de Catalog Service (eigen database per microservice)
  catalog_db:
    image: postgres:latest
    container_name: ballcom_catalog_db
    environment:
      POSTGRES_USER: catalog_user
      POSTGRES_PASSWORD: catalog_password
      POSTGRES_DB: catalog_db
    ports:
      - "5433:5432" # Eigen poort (5433) om conflict met ordering_db (5432) te vermijden
    networks:
      - ballcom_network

  # 4. De database voor de Payment Service (eigen database per microservice)
  payment_db:
    image: postgres:latest
    container_name: ballcom_payment_db
    environment:
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_password
      POSTGRES_DB: payment_db
    ports:
      - "5434:5432" # Eigen poort (5434) om conflict met andere databases te vermijden
    networks:
      - ballcom_network

networks:
  ballcom_network:
    driver: bridge
